name: Build Pen Pal for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logic tests
        run: node --test tests/logic.test.js

      - name: Server and updater tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Install build tools
        run: python -m pip install --upgrade "pywebview>=5" pyinstaller

      - name: Build PenPal.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name PenPal --icon assets/penpal.ico --add-data "public;public" penpal.py

      - name: Self-check the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PenPal.exe -ArgumentList '--check', "$pwd\check.txt" -Wait -PassThru
          Get-Content check.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Open the real window and drive it
        shell: pwsh
        run: |
          foreach ($bar in 'custom', 'windows') {
            $out = "$pwd\smoke-$bar.txt"
            $p = Start-Process -FilePath dist\PenPal.exe -ArgumentList '--smoke', $out, '--title-bar', $bar -PassThru
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host "$bar title bar: the window hung"; exit 1 }
            Write-Host "---- $bar title bar"
            if (Test-Path $out) { Get-Content $out } else { Write-Host "no result file: the app crashed" }
            if ($p.ExitCode -ne 0) { exit 1 }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: PenPal-exe
          path: dist/PenPal.exe

      - name: Publish a release when the version changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path server.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "Release $tag already exists; nothing to publish."; exit 0 }
          gh release create $tag dist\PenPal.exe --target $env:GITHUB_SHA --title "Pen Pal $tag" --notes-file RELEASE_NOTES.md
