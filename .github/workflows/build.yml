name: Build Pen Pal for Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Logic tests
        run: node --test tests/logic.test.js

      - name: Server tests
        run: python -m unittest tests/test_server.py

      - name: Install build tools
        run: python -m pip install --upgrade "pywebview>=5" pyinstaller

      - name: Build PenPal.exe
        run: python -m PyInstaller --noconfirm --onefile --windowed --name PenPal --icon assets/penpal.ico --add-data "public;public" penpal.py

      - name: Self-check the built exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\PenPal.exe -ArgumentList '--check', "$pwd\check.txt" -Wait -PassThru
          Get-Content check.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: PenPal-exe
          path: dist/PenPal.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist\PenPal.exe --title "Pen Pal $env:GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
