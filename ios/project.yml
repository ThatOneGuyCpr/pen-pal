# Pen Pal for iPhone. The Xcode project is generated from this file (XcodeGen), on GitHub's Mac builders.
name: PenPal
options:
  bundleIdPrefix: com.thatoneguycpr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  PenPal:
    type: application
    platform: iOS
    sources:
      - path: PenPal
        excludes:
          - "*.js"
          - "Fonts/**"
      - path: PenPal/bridge.js
        buildPhase: resources
      - path: PenPal/Fonts
        buildPhase: resources
        type: folder
      - path: ../public/logic.js
        buildPhase: resources
      - path: ../public/directory.json
        buildPhase: resources
    info:
      path: PenPal/Info.plist
      properties:
        CFBundleDisplayName: Pen Pal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fonts/young-serif-400.ttf
          - Fonts/public-sans-400.ttf
          - Fonts/public-sans-500.ttf
          - Fonts/public-sans-600.ttf
          - Fonts/public-sans-700.ttf
          - Fonts/ibm-plex-mono-400.ttf
          - Fonts/ibm-plex-mono-500.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thatoneguycpr.penpal
        PRODUCT_NAME: PenPal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
  PenPalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PenPalTests]
    dependencies:
      - target: PenPal
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PenPal.app/PenPal
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.thatoneguycpr.penpal.tests
schemes:
  PenPal:
    build:
      targets:
        PenPal: all
        PenPalTests: [test]
    test:
      targets: [PenPalTests]
