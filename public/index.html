<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pen Pal</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='1.5' y='5' width='21' height='14' rx='2' fill='%2316202b'/%3E%3Cpath d='M2.5 6.5l9.5 6.8 9.5-6.8' fill='none' stroke='%23f8f9f9' stroke-width='1.6' stroke-linejoin='round'/%3E%3Cpath d='M15.5 16.5h4.5' stroke='%23b8322a' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stripe" aria-hidden="true"></div>
  <header id="titlebar" hidden>
    <div id="tbDrag" class="tb-drag">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="1.5" y="5" width="21" height="14" rx="2" fill="currentColor"/><path d="M2.5 6.5l9.5 6.8 9.5-6.8" fill="none" stroke="var(--side)" stroke-width="1.6" stroke-linejoin="round"/><path d="M15.5 16.5h4.5" stroke="var(--red)" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Pen Pal</span>
    </div>
    <button id="tbMin" class="tb-btn" type="button" aria-label="Minimize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button id="tbMax" class="tb-btn" type="button" aria-label="Maximize"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="13" height="13" rx="1"/></svg></button>
    <button id="tbClose" class="tb-btn tb-close" type="button" aria-label="Close"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div id="resizers" hidden aria-hidden="true"><div data-edge="n"></div><div data-edge="s"></div><div data-edge="e"></div><div data-edge="w"></div><div data-edge="nw"></div><div data-edge="ne"></div><div data-edge="sw"></div><div data-edge="se"></div></div>
  <div class="shell">
    <nav id="nav" aria-label="Sections"></nav>
    <div class="mainwrap">
      <div class="topbar">
        <button id="undoBtn" class="small" type="button" disabled>Undo</button>
        <button id="redoBtn" class="small" type="button" disabled>Redo</button>
      </div>
      <div id="banner" role="alert"></div>
      <div id="syncNote" aria-live="polite"></div>
      <main id="view" tabindex="-1"><p class="loading">Loading…</p></main>
    </div>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
